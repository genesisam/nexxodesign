<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Galería 3D de proyectos — Nexxo</title>
<meta name="description" content="Una galería construida con bloques: recorre los proyectos de Nexxo en 3D, abre cada caso y salta al portafolio completo.">
<link rel="canonical" href="https://nexxodesign.com/galeria">
<link rel="icon" href="/favicon.ico">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Nexxo">
<meta property="og:locale" content="es_ES">
<meta property="og:url" content="https://nexxodesign.com/galeria">
<meta property="og:title" content="Galería 3D de proyectos — Nexxo">
<meta property="og:description" content="Una galería construida con bloques: recorre los proyectos en 3D, abre cada caso y salta al portafolio completo.">
<meta property="og:image" content="https://nexxodesign.com/galeria/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="627">
<meta property="og:image:alt" content="Galería de ladrillos con los proyectos de Nexxo colgados en la pared">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://nexxodesign.com/galeria/og.jpg">
<meta name="theme-color" content="#0E0E0E">
<style>
  :root { --ink:#0E0E0E; --paper:#EFEBE3; --muted:#79716E; --violet:#A694E8; --accent:#5B3DF5; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--ink); color: var(--paper);
    font: 14px/1.5 "IBM Plex Mono", ui-monospace, monospace; overflow: hidden; }
  canvas { display: block; touch-action: pan-y; }
  .eyebrow { font-size: 9px; text-transform: uppercase; letter-spacing: .28em; color: rgb(239 235 227 / .6); }
  #vignette { position: fixed; inset: 0; pointer-events: none; opacity: 0; transition: opacity .9s;
    background: radial-gradient(ellipse at 65% 45%, transparent 30%, rgb(14 14 14 / .78) 100%); }
  body.mobile #vignette { background: radial-gradient(ellipse at 50% 30%, transparent 30%, rgb(14 14 14 / .8) 100%); }
  #top { position: fixed; top: 16px; left: 20px; right: 20px; display: flex; align-items: center; gap: 10px; pointer-events: none; z-index: 3; }
  #top .brand { pointer-events: auto; color: var(--paper); text-decoration: none; display: flex; flex-direction: column; gap: 2px; margin-right: auto; }
  #top .brand b { font: 600 15px/1 system-ui, sans-serif; letter-spacing: .02em; }
  #portfolio { pointer-events: auto; font: inherit; font-size: 10px; letter-spacing: .2em; text-transform: uppercase; text-decoration: none;
    color: var(--paper); background: var(--accent); border: 1px solid var(--accent); padding: 8px 12px; white-space: nowrap; }
  #portfolio:hover { background: #4a2fe0; }
  #portfolio:focus-visible, #top .brand:focus-visible { outline: 2px solid var(--violet); outline-offset: 2px; }
  body.mobile #portfolio { padding: 7px 10px; font-size: 9px; letter-spacing: .14em; }
  body.mobile #skip { display: none; }
  #loader { position: fixed; inset: 0; z-index: 5; display: grid; place-items: center; background: var(--ink); transition: opacity .6s, visibility .6s; }
  #loader.done { opacity: 0; visibility: hidden; }
  #loader .box { width: min(260px, 70vw); text-align: center; }
  #loader .track { height: 2px; background: rgb(239 235 227 / .15); margin-top: 14px; overflow: hidden; }
  #lbar { height: 100%; background: var(--violet); transform: scaleX(.05); transform-origin: left; transition: transform .25s; }
  #skip { pointer-events: auto; background: none; border: 1px solid rgb(239 235 227 / .3); color: var(--paper);
    font: inherit; font-size: 10px; letter-spacing: .2em; text-transform: uppercase; padding: 6px 10px; cursor: pointer; }
  #tip { position: fixed; pointer-events: none; padding: 6px 10px; background: rgb(14 14 14 / .82); border: 1px solid rgb(239 235 227 / .18);
    font-size: 10px; letter-spacing: .2em; text-transform: uppercase; opacity: 0; transform: translate(14px, 14px); transition: opacity .2s; }
  #list { position: fixed; left: 20px; right: 20px; bottom: 18px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; transition: opacity .4s; }
  #list button, .btn { font: inherit; font-size: 10px; letter-spacing: .2em; text-transform: uppercase; color: rgb(239 235 227 / .8);
    background: rgb(14 14 14 / .55); border: 1px solid rgb(239 235 227 / .25); padding: 8px 12px; cursor: pointer; }
  #list button:hover, #list button.on, .btn:hover { border-color: var(--paper); color: var(--paper); }
  #list button:focus-visible, .btn:focus-visible { outline: 2px solid var(--violet); outline-offset: 2px; }
  #list .n { opacity: .5; margin-right: 6px; }
  #panel { position: fixed; left: 20px; top: 50%; transform: translate(-16px, -50%); width: min(420px, 36vw); opacity: 0; pointer-events: none;
    transition: opacity .5s, transform .6s cubic-bezier(.16,1,.3,1); background: rgb(14 14 14 / .62); backdrop-filter: blur(6px);
    border: 1px solid rgb(239 235 227 / .12); padding: 26px; }
  #panel.on { opacity: 1; transform: translate(0, -50%); pointer-events: auto; }
  #panel h2 { font: 600 clamp(1.6rem, 2.4vw, 2.4rem)/1.02 system-ui, sans-serif; letter-spacing: -.035em; margin: 10px 0 6px; }
  #panel .cat { color: rgb(239 235 227 / .7); margin: 0 0 14px; }
  #panel .sum { color: rgb(239 235 227 / .78); font-size: 13px; }
  #panel ul { list-style: none; padding: 0; margin: 14px 0 20px; display: flex; flex-wrap: wrap; gap: 6px; }
  #panel li { font-size: 10px; letter-spacing: .12em; text-transform: uppercase; border: 1px solid rgb(166 148 232 / .45); color: var(--violet); padding: 4px 8px; }
  #panel .actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  #panel a.primary { background: var(--accent); color: var(--paper); border-color: var(--accent); text-decoration: none; }
  #panel .nav { display: flex; gap: 8px; margin-left: auto; }
  body.mobile #panel { left: 12px; right: 12px; top: auto; bottom: 12px; width: auto; transform: translate(0, 24px); padding: 18px; }
  body.mobile #panel.on { transform: translate(0, 0); }
  body.mobile #panel .sum { font-size: 12px; }
  #mnav { position: fixed; left: 12px; right: 12px; bottom: 14px; display: none; gap: 8px; align-items: center; justify-content: space-between; }
  body.mobile #mnav { display: flex; }
  body.mobile #list { display: none; }
  #mnav .title { flex: 1; text-align: center; }
  #mnav .title b { display: block; font: 600 18px/1.1 system-ui, sans-serif; letter-spacing: -.02em; }
  #mnav button { min-width: 48px; min-height: 48px; }
  #dots { position: fixed; left: 0; right: 0; bottom: 84px; display: none; justify-content: center; gap: 6px; }
  body.mobile #dots { display: flex; }
  #dots i { width: 6px; height: 6px; border-radius: 50%; background: rgb(239 235 227 / .3); }
  #dots i.on { background: var(--paper); }
  .hide { opacity: 0 !important; pointer-events: none !important; }
  #stats { position: fixed; right: 20px; bottom: 60px; font-size: 10px; color: var(--muted); white-space: pre; display: none; }
</style>
</head>
<body>
<div id="vignette"></div>
<div id="loader" role="status" aria-live="polite"><div class="box"><span class="eyebrow">Montando la galería…</span><div class="track"><div id="lbar"></div></div></div></div>
<header id="top">
  <a class="brand" href="https://nexxodesign.com" aria-label="Nexxo, ir al inicio"><b>NEXXO</b><span class="eyebrow">Galería 3D de proyectos</span></a>
  <button id="skip">Saltar intro</button>
  <a id="portfolio" href="https://nexxodesign.com/proyectos">Ver portafolio completo →</a>
</header>
<div id="tip"></div>
<nav id="list" aria-label="Proyectos de la galería"></nav>
<div id="dots" aria-hidden="true"></div>
<nav id="mnav" aria-label="Recorrer la galería">
  <button class="btn" id="mprev" aria-label="Proyecto anterior">←</button>
  <button class="btn title" id="mopen"><span class="eyebrow" id="mnum"></span><b id="mtitle"></b></button>
  <button class="btn" id="mnext" aria-label="Proyecto siguiente">→</button>
</nav>
<article id="panel" aria-live="polite">
  <p class="eyebrow" id="pnum"></p>
  <h2 id="ptitle"></h2>
  <p class="cat" id="pcat"></p>
  <p class="sum" id="psum"></p>
  <ul id="psrv"></ul>
  <div class="actions">
    <a class="btn primary" id="plink" href="#" target="_blank" rel="noopener">Ver proyecto →</a>
    <button class="btn" id="pback">← Volver a la galería</button>
    <span class="nav"><button class="btn" id="pprev" aria-label="Anterior">←</button><button class="btn" id="pnext" aria-label="Siguiente">→</button></span>
  </div>
</article>

<script type="module" src="/galeria/gallery.js"></script>
</body>
</html>
